<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的报修 - 宿舍管理系统</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent-purple: #9B59B6;
            --card-bg: #FFFFFF;
            --text-primary: #2D3436;
            --text-secondary: #636E72;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            --radius: 20px;
            --radius-sm: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; 
            background: linear-gradient(135deg, #FFF5F5 0%, #E8F4FD 100%);
            min-height: 100vh;
            padding: 16px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .header-left h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .back-btn {
            padding: 8px 16px;
            background: var(--card-bg);
            border: none;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }
        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        .repair-item {
            background: #FAFBFC;
            border-radius: var(--radius-sm);
            padding: 18px;
            margin-bottom: 12px;
        }
        .repair-item:last-child {
            margin-bottom: 0;
        }

        .repair-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .repair-type {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 15px;
        }
        .repair-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .repair-status.pending {
            background: rgba(253, 150, 33, 0.15);
            color: #F39C12;
        }
        .repair-status.processing {
            background: rgba(52, 152, 219, 0.15);
            color: #3498DB;
        }
        .repair-status.completed {
            background: rgba(46, 204, 113, 0.15);
            color: #2ECC71;
        }

        .repair-content {
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }
        .repair-image img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            flex-shrink: 0;
        }
        .repair-desc {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
            flex: 1;
            padding-top: 2px;
        }

        .repair-footer {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #95A5A6;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
        }
        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }
        .empty-text {
            color: var(--text-secondary);
            font-size: 14px;
        }

        @media (min-width: 768px) {
            body {
                max-width: 800px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <h1>📋 我的报修</h1>
        </div>
        <button class="back-btn" onclick="location.href='/student/dashboard'">← 返回</button>
    </div>

    <div class="card">
        <div th:if="${#lists.isEmpty(repairs)}" class="empty-state">
            <div class="empty-icon">📭</div>
            <div class="empty-text">暂无报修记录</div>
        </div>

        <div th:each="repair : ${repairs}" class="repair-item">
            <div class="repair-header">
                <div class="repair-type">[[${repair.repairType}]]</div>
                <div th:class="'repair-status ' + ${repair.status == '待处理' ? 'pending' : repair.status == '处理中' ? 'processing' : 'completed'}">
                    [[${repair.status}]]
                </div>
            </div>
            <div class="repair-content">
                <div th:if="${repair.imagePath != null && !repair.imagePath.isEmpty()}" class="repair-image">
                    <img th:src="${repair.imagePath}" alt="故障图片" />
                </div>
                <div class="repair-desc">[[${repair.description}]]</div>
            </div>
            <div class="repair-footer">
                <div>宿舍：[[${repair.dormitoryNumber}]]</div>
                <div>提交时间：[[${#temporals.format(repair.createTime, 'yyyy-MM-dd HH:mm')}]]</div>
            </div>
        </div>
    </div>
</body>
</html>
