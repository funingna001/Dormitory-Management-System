<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>维修工中心 - 宿舍管理系统</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent-yellow: #FFE66D;
            --accent-purple: #9B59B6;
            --bg-gradient-start: #F0F7FF;
            --bg-gradient-end: #E8F5E9;
            --card-bg: #FFFFFF;
            --text-primary: #2D3436;
            --text-secondary: #636E72;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            --radius: 20px;
            --radius-sm: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; 
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            padding: 16px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .header-left h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--secondary) 0%, #2ECC71 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-left p {
            color: var(--text-secondary);
            font-size: 13px;
            margin-top: 4px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--card-bg);
            padding: 8px 16px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--secondary) 0%, #2ECC71 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: 700;
            font-size: 14px;
        }
        .user-name {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 14px;
        }
        .logout-btn {
            padding: 8px 20px;
            background: linear-gradient(135deg, #FF6B6B 0%, #E74C3C 100%);
            color: white;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }
        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .stat-card {
            background: #FAFBFC;
            padding: 20px 12px;
            border-radius: var(--radius-sm);
            text-align: center;
        }
        .stat-card.pending { border-top: 4px solid #F39C12; }
        .stat-card.processing { border-top: 4px solid #3498DB; }
        .stat-card.completed { border-top: 4px solid #2ECC71; }
        .stat-count {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 20px;
        }
        .action-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 20px;
            background: #FAFBFC;
            border-radius: var(--radius-sm);
            text-decoration: none;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            border-color: var(--secondary);
        }
        .btn-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }
        .btn-icon.pending-bg { background: rgba(243, 156, 18, 0.15); }
        .btn-icon.processing-bg { background: rgba(52, 152, 219, 0.15); }
        .btn-icon.completed-bg { background: rgba(46, 204, 113, 0.15); }
        .btn-content {
            flex: 1;
        }
        .btn-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
        }
        .btn-desc {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .welcome-card {
            background: linear-gradient(135deg, var(--secondary) 0%, #2ECC71 100%);
            color: white;
            text-align: center;
            padding: 36px 24px;
            border-radius: var(--radius);
        }
        .welcome-card .welcome-icon {
            font-size: 56px;
            margin-bottom: 14px;
        }
        .welcome-card h2 {
            font-size: 22px;
            margin-bottom: 8px;
        }
        .welcome-card p {
            opacity: 0.9;
            font-size: 14px;
        }

        @media (min-width: 768px) {
            body {
                padding: 24px;
                max-width: 800px;
                margin: 0 auto;
            }
            .action-buttons {
                grid-template-columns: repeat(2, 1fr);
            }
            .stats-grid {
                gap: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <h1>🛠️ 维修工中心</h1>
            <p>欢迎回来，<span th:text="${user.realName != null ? user.realName : user.username}"></span></p>
        </div>
        <div class="header-right">
            <div class="user-info">
                <div class="user-avatar" th:text="${user.realName != null ? user.realName.charAt(0) : '工'}"></div>
                <div class="user-name" th:text="${user.realName != null ? user.realName : user.username}"></div>
            </div>
            <button class="logout-btn" onclick="location.href='/logout'">退出登录</button>
        </div>
    </div>

    <div class="dashboard-grid">
        <div class="welcome-card">
            <div class="welcome-icon">👷</div>
            <h2>欢迎来到维修工中心</h2>
            <p>查看报修任务，完成维修工作</p>
        </div>

        <div class="card">
            <h3 style="font-size: 17px; font-weight: 700; color: var(--text-primary); margin-bottom: 16px;">报修统计</h3>
            <div class="stats-grid">
                <div class="stat-card pending">
                    <div class="stat-count" th:text="${pendingCount}">0</div>
                    <div class="stat-label">待处理</div>
                </div>
                <div class="stat-card processing">
                    <div class="stat-count" th:text="${processingCount}">0</div>
                    <div class="stat-label">处理中</div>
                </div>
                <div class="stat-card completed">
                    <div class="stat-count" th:text="${completedCount}">0</div>
                    <div class="stat-label">已完成</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h3 style="font-size: 17px; font-weight: 700; color: var(--text-primary); margin-bottom: 16px;">快捷操作</h3>
            <div class="action-buttons">
                <a href="/worker/repair-list?status=待处理" class="action-btn">
                    <div class="btn-icon pending-bg">📋</div>
                    <div class="btn-content">
                        <div class="btn-title">待处理任务</div>
                        <div class="btn-desc">查看需要处理的报修申请</div>
                    </div>
                </a>
                <a href="/worker/repair-list?status=处理中" class="action-btn">
                    <div class="btn-icon processing-bg">🔧</div>
                    <div class="btn-content">
                        <div class="btn-title">进行中任务</div>
                        <div class="btn-desc">查看正在处理的报修</div>
                    </div>
                </a>
                <a href="/worker/repair-list?status=已完成" class="action-btn">
                    <div class="btn-icon completed-bg">✅</div>
                    <div class="btn-content">
                        <div class="btn-title">已完成任务</div>
                        <div class="btn-desc">查看已完成的维修记录</div>
                    </div>
                </a>
                <a href="/worker/repair-list" class="action-btn">
                    <div class="btn-icon completed-bg">📊</div>
                    <div class="btn-content">
                        <div class="btn-title">全部任务</div>
                        <div class="btn-desc">查看所有报修记录</div>
                    </div>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
