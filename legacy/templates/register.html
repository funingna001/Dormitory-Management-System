<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>宿舍管理系统 - 注册</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent-yellow: #FFE66D;
            --accent-purple: #9B59B6;
            --accent-blue: #3498DB;
            --accent-green: #2ECC71;
            --accent-orange: #F39C12;
            --bg-gradient-start: #FFF5F5;
            --bg-gradient-end: #E8F4FD;
            --card-bg: #FFFFFF;
            --text-primary: #2D3436;
            --text-secondary: #636E72;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.12);
            --radius: 20px;
            --radius-sm: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .bg-decoration {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
        }
        .bg-decoration:nth-child(1) {
            background: var(--accent-blue);
            top: -100px;
            left: -100px;
        }
        .bg-decoration:nth-child(2) {
            background: var(--secondary);
            top: -50px;
            right: -50px;
        }
        .bg-decoration:nth-child(3) {
            background: var(--primary);
            bottom: -80px;
            left: 20%;
        }
        .bg-decoration:nth-child(4) {
            background: var(--accent-green);
            bottom: -60px;
            right: 10%;
        }

        .register-container {
            background: var(--card-bg);
            padding: 45px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            width: 480px;
            position: relative;
            z-index: 10;
            border: 1px solid rgba(255,255,255,0.6);
            backdrop-filter: blur(10px);
        }

        .register-header {
            text-align: center;
            margin-bottom: 35px;
        }
        .register-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--secondary) 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            box-shadow: 0 8px 25px rgba(52, 152, 219, 0.3);
            font-size: 36px;
            color: white;
        }
        h2 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .register-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #E0E6ED;
            border-radius: var(--radius-sm);
            font-size: 15px;
            background: #FAFBFC;
            transition: all 0.3s ease;
            outline: none;
        }
        input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.1);
            background: white;
        }
        input::placeholder {
            color: #CBD5E0;
            font-weight: 400;
        }

        .required-mark {
            color: var(--primary);
            margin-left: 4px;
            font-weight: 700;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--accent-blue) 0%, #2980B9 100%);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
        }
        button:active {
            transform: translateY(0);
        }

        .error {
            color: #E74C3C;
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 500;
            background: #FFF0F0;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border-left: 4px solid #E74C3C;
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
        }
        .login-link a {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        .login-link a:hover {
            color: var(--secondary);
            text-decoration: underline;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            gap: 15px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #E0E6ED;
        }
        .divider span {
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
        }

        .tips-card {
            background: linear-gradient(135deg, #F0FFF4 0%, #FFF8F8 100%);
            padding: 16px;
            border-radius: var(--radius-sm);
            border-left: 4px solid var(--accent-green);
            margin-top: 15px;
        }
        .tips-card .title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        .tips-card .desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
    </style>
</head>
<body>
    <div class="bg-decoration"></div>
    <div class="bg-decoration"></div>
    <div class="bg-decoration"></div>
    <div class="bg-decoration"></div>

    <div class="register-container">
        <div class="register-header">
            <div class="register-icon">✏️</div>
            <h2>宿舍管理系统</h2>
            <p class="register-subtitle">创建您的账号，开始使用系统</p>
        </div>

        <div th:if="${error}" class="error" th:text="${error}"></div>

        <form action="/register" method="post">
            <div class="form-group">
                <label for="username">用户名<span class="required-mark">*</span></label>
                <input type="text" id="username" name="username" placeholder="请输入用户名" required>
            </div>
            <div class="form-group">
                <label for="password">密码<span class="required-mark">*</span></label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">确认密码<span class="required-mark">*</span></label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="请再次输入密码" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="realName">真实姓名</label>
                    <input type="text" id="realName" name="realName" placeholder="请输入真实姓名">
                </div>
                <div class="form-group">
                    <label for="phone">手机号</label>
                    <input type="tel" id="phone" name="phone" placeholder="请输入手机号">
                </div>
            </div>
            <button type="submit">注 册</button>
        </form>

        <div class="divider">
            <span>或</span>
        </div>

        <div class="login-link">
            已有账号？<a href="/login">立即登录</a>
        </div>

        <div class="tips-card">
            <div class="title">温馨提示</div>
            <div class="desc">注册后您将获得学生权限，如需管理员权限请联系系统管理员。</div>
        </div>
    </div>
</body>
</html>
