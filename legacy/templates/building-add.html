<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>宿舍管理系统 - 添加楼栋</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent-yellow: #FFE66D;
            --accent-purple: #9B59B6;
            --accent-blue: #3498DB;
            --accent-green: #2ECC71;
            --accent-orange: #F39C12;
            --bg-gradient-start: #FFF5F5;
            --bg-gradient-end: #E8F4FD;
            --card-bg: #FFFFFF;
            --text-primary: #2D3436;
            --text-secondary: #636E72;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.12);
            --radius: 20px;
            --radius-sm: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .bg-decoration {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            z-index: 0;
        }
        .bg-decoration:nth-child(1) {
            background: var(--accent-blue);
            top: -100px;
            left: -100px;
        }
        .bg-decoration:nth-child(2) {
            background: var(--secondary);
            top: -50px;
            right: -50px;
        }
        .bg-decoration:nth-child(3) {
            background: var(--accent-green);
            bottom: -80px;
            left: 20%;
        }

        .header {
            background: var(--card-bg);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            position: relative;
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.6);
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-links {
            display: flex;
            gap: 5px;
            background: rgba(0,0,0,0.03);
            padding: 6px;
            border-radius: var(--radius-sm);
        }
        .nav-links .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            padding: 10px 20px;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-size: 14px;
        }
        .nav-links .nav-link:hover {
            color: var(--accent-blue);
            background: rgba(52, 152, 219, 0.1);
        }
        .nav-links .nav-link.active {
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--secondary) 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 15px;
        }
        .user-info .welcome-text {
            color: var(--text-primary);
            font-weight: 600;
        }
        .role-tag {
            display: inline-block;
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--secondary) 100%);
            color: white;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        .logout-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            transition: all 0.3s ease;
        }
        .logout-link:hover {
            color: var(--primary);
            background: rgba(255, 107, 107, 0.1);
        }

        .content {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 30px;
            position: relative;
            z-index: 10;
        }

        .form-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(255,255,255,0.6);
        }

        .form-header {
            text-align: center;
            margin-bottom: 35px;
        }
        .form-header h2 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .form-header p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 22px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 14px;
        }
        .form-group label .required {
            color: var(--primary);
            margin-left: 4px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #E0E6ED;
            border-radius: var(--radius-sm);
            font-size: 15px;
            background: #FAFBFC;
            transition: all 0.3s ease;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.1);
            background: white;
        }

        .gender-options {
            display: flex;
            gap: 25px;
            padding-top: 5px;
        }
        .gender-option {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 12px 20px;
            border: 2px solid #E0E6ED;
            border-radius: var(--radius-sm);
            transition: all 0.3s ease;
            flex: 1;
            justify-content: center;
        }
        .gender-option:hover {
            border-color: var(--accent-blue);
            background: rgba(52, 152, 219, 0.05);
        }
        .gender-option input[type="radio"] {
            width: 20px;
            height: 20px;
            accent-color: var(--accent-blue);
        }
        .gender-option label {
            margin-bottom: 0;
            font-weight: 600;
            font-size: 15px;
        }

        .floor-config {
            border: 2px solid #E0E6ED;
            border-radius: var(--radius-sm);
            padding: 15px;
            margin-top: 10px;
            background: #FAFBFC;
        }
        .floor-header {
            font-weight: 600;
            font-size: 15px;
            color: #2C3E50;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #E0E6ED;
        }
        .room-type-config {
            display: flex;
            gap: 15px;
        }
        .room-type-item {
            flex: 1;
        }
        .room-type-item label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #555;
        }
        .room-type-item input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #E0E6ED;
            border-radius: var(--radius-sm);
            font-size: 15px;
            transition: border-color 0.3s ease;
        }
        .room-type-item input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }
        .room-preview {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #E0E6ED;
        }
        .preview-label {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .preview-numbers {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .room-tag {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        .room-tag.double-room {
            background: #E8F5E9;
            color: #2E7D32;
            border: 1px solid #A5D6A7;
        }
        .room-tag.four-room {
            background: #E3F2FD;
            color: #1565C0;
            border: 1px solid #90CAF9;
        }
        .room-tag.six-room {
            background: #FFF3E0;
            color: #E65100;
            border: 1px solid #FFCC80;
        }
        .room-tag.editable {
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .room-tag.editable:hover {
            transform: scale(1.1);
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .room-tag.editable:active {
            transform: scale(0.95);
        }

        .config-mode-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .config-mode-btn {
            flex: 1;
            padding: 10px 20px;
            border: 2px solid #E0E0E0;
            border-radius: 8px;
            background: white;
            color: #666;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .config-mode-btn:hover {
            border-color: #4CAF50;
            color: #4CAF50;
        }
        .config-mode-btn.active {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            border-color: #4CAF50;
            color: white;
        }
        .config-description {
            background: #F5F5F5;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
        }
        .config-description p {
            margin: 5px 0;
            font-size: 14px;
            color: #666;
        }
        .custom-config-selector {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }
        .custom-config-selector select {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        .btn-save-floor {
            display: block;
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.2s ease;
        }
        .btn-save-floor:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
        }
        .custom-config-summary {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        .modified-floor-item {
            padding: 8px 12px;
            background: #E3F2FD;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 13px;
            color: #1565C0;
        }
        .room-count-display {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #f8f9fa;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            color: #333;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .room-type-legend {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #666;
        }
        .legend-item .room-tag {
            width: 16px;
            height: 16px;
            padding: 0;
            border-radius: 4px;
        }
        .room-tag-icon {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 3px;
            margin-right: 6px;
            vertical-align: middle;
        }
        .room-tag-icon.double-room {
            background: #E8F5E9;
            border: 1px solid #A5D6A7;
        }
        .room-tag-icon.four-room {
            background: #E3F2FD;
            border: 1px solid #90CAF9;
        }
        .room-tag-icon.six-room {
            background: #FFF3E0;
            border: 1px solid #FFCC80;
        }
        .sort-mode-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .sort-mode-btn {
            flex: 1;
            padding: 8px 16px;
            border: 2px solid #E0E0E0;
            border-radius: 6px;
            background: white;
            color: #666;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .sort-mode-btn:hover {
            border-color: #4CAF50;
            color: #4CAF50;
        }
        .sort-mode-btn.active {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            border-color: #4CAF50;
            color: white;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        .btn-group button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-submit {
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--secondary) 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
        }
        .btn-cancel {
            background: #F8F9FA;
            color: var(--text-secondary);
            border: 2px solid #E9ECEF;
        }
        .btn-cancel:hover {
            background: #E9ECEF;
        }

        .error {
            background: #FFF0F0;
            border-left: 4px solid var(--primary);
            padding: 15px;
            border-radius: var(--radius-sm);
            color: #E74C3C;
            font-weight: 500;
            margin-bottom: 25px;
            text-align: center;
        }

        .building-name-display {
            padding: 14px 18px;
            background: linear-gradient(135deg, #EFF6FF 0%, #DBEAFE 100%);
            border: 2px solid #BFDBFE;
            border-radius: var(--radius-sm);
            font-size: 18px;
            font-weight: 700;
            color: #1D4ED8;
            text-align: center;
        }

        .floating-ai-wrapper {
            position: fixed;
            left: 20px;
            bottom: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .floating-ai {
            width: 420px;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2), 0 0 0 1px rgba(0,0,0,0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 600px;
            margin-bottom: 15px;
            opacity: 0;
            visibility: hidden;
            transform: translateX(-100%) scale(0.9);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .floating-ai.open {
            opacity: 1;
            visibility: visible;
            transform: translateX(0) scale(1);
        }

        .floating-ai-toggle {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.5);
            border: 3px solid rgba(255, 255, 255, 0.9);
        }

        .floating-ai-toggle:hover {
            transform: scale(1.15);
            box-shadow: 0 12px 32px rgba(102, 126, 234, 0.6);
        }

        .floating-ai-toggle span {
            font-size: 26px;
            transition: transform 0.3s ease;
        }

        .floating-ai.open + .floating-ai-toggle span {
            transform: rotate(45deg);
        }

        .floating-ai-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .floating-ai-header .ai-icon {
            font-size: 24px;
            background: rgba(255,255,255,0.2);
            padding: 8px;
            border-radius: 8px;
        }

        .floating-ai-header .ai-title {
            color: white;
            font-size: 15px;
            font-weight: 700;
        }

        .floating-ai-commands {
            padding: 12px 15px;
            background: #F8F9FA;
            border-bottom: 1px solid #E9ECEF;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .floating-ai-commands .command-btn {
            padding: 5px 12px;
            background: white;
            border: 1px solid #DEE2E6;
            border-radius: 15px;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .floating-ai-commands .command-btn:hover {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: white;
        }

        .floating-ai-chat {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: var(--card-bg);
        }

        .floating-ai-chat .message {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .floating-ai-chat .message.ai .avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .floating-ai-chat .message.user .avatar {
            background: var(--accent-blue);
            color: white;
        }

        .floating-ai-chat .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .floating-ai-chat .message-content {
            flex: 1;
            max-width: 80%;
        }

        .floating-ai-chat .message.ai .message-content {
            background: #F8F9FA;
            border: 1px solid #E9ECEF;
            border-radius: 0 10px 10px 10px;
        }

        .floating-ai-chat .message.user .message-content {
            background: var(--accent-blue);
            color: white;
            border-radius: 10px 0 10px 10px;
            margin-left: auto;
        }

        .floating-ai-chat .message-text {
            padding: 8px 12px;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .floating-ai-chat .message.ai .message-text {
            color: var(--text-primary);
        }

        .floating-ai-chat .message.user .message-text {
            color: white;
        }

        .floating-ai-input-area {
            padding: 12px 15px;
            background: #F8F9FA;
            border-top: 1px solid #E9ECEF;
            display: flex;
            gap: 8px;
        }

        .floating-ai-input-area .ai-input {
            flex: 1;
            padding: 8px 14px;
            border: 1px solid #DEE2E6;
            border-radius: 20px;
            font-size: 13px;
            outline: none;
            transition: all 0.3s ease;
            background: white;
        }

        .floating-ai-input-area .ai-input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.1);
        }

        .floating-ai-input-area .ai-send-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .floating-ai-input-area .ai-send-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(102, 126, 234, 0.4);
        }

        .floating-ai-input-area .ai-send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .floating-ai-chat .typing-indicator {
            display: flex;
            gap: 3px;
            padding: 8px 12px;
        }

        .floating-ai-chat .typing-dot {
            width: 6px;
            height: 6px;
            background: #ADB5BD;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }

        .floating-ai-chat .typing-dot:nth-child(1) { animation-delay: 0s; }
        .floating-ai-chat .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .floating-ai-chat .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="bg-decoration"></div>
    <div class="bg-decoration"></div>
    <div class="bg-decoration"></div>

    <div class="header">
        <h1>🏠 宿舍管理系统</h1>
        <div class="nav-links">
            <a href="/" class="nav-link">首页</a>
            <a href="/dormitories" class="nav-link">宿舍管理</a>
            <a href="/buildings" class="nav-link active">楼栋管理</a>
        </div>
        <div class="user-info">
            <span class="welcome-text">欢迎, <span th:text="${user.realName != null && !user.realName.isEmpty() ? user.realName : user.username}"></span></span>
            <span class="role-tag" th:text="${user.role == 'admin' ? '管理员' : '学生'}"></span>
            <a href="/logout" class="logout-link">退出登录</a>
        </div>
    </div>

    <div class="content">
        <div class="form-card">
            <div class="form-header">
                <h2>添加楼栋</h2>
                <p>楼栋名称将自动递增，请设置楼层数和每层宿舍数</p>
            </div>

            <div th:if="${error}" class="error" th:text="${error}"></div>

            <form th:action="@{/buildings/add}" th:object="${building}" method="post">
                <div class="form-group">
                    <label>楼栋名称</label>
                    <div class="building-name-display" th:text="${nextBuildingName}"></div>
                </div>

                <div class="form-group">
                    <label>性别限制<span class="required">*</span></label>
                    <div class="gender-options">
                        <div class="gender-option">
                            <input type="radio" id="genderMale" th:field="*{gender}" value="男" required>
                            <label for="genderMale">男</label>
                        </div>
                        <div class="gender-option">
                            <input type="radio" id="genderFemale" th:field="*{gender}" value="女" required>
                            <label for="genderFemale">女</label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>楼层数量<span class="required">*</span></label>
                    <input type="number" name="floorCount" id="floorCount" min="1" max="30" value="6" required placeholder="请输入楼层数量（1-30）" onchange="initFloorConfigs()">
                </div>

                <div class="form-group">
                    <label>每层房间数量<span class="required">*</span></label>
                    <input type="number" name="roomsPerFloor" id="roomsPerFloor" min="2" max="50" value="10" required placeholder="请输入每层房间数量（2-50）" onchange="initFloorConfigs()">
                </div>

                <div class="form-group">
                    <label>房间配置模式<span class="required">*</span></label>
                    <div class="config-mode-buttons">
                        <button type="button" class="config-mode-btn active" id="defaultModeBtn" onclick="switchToDefaultMode()">默认配置</button>
                        <button type="button" class="config-mode-btn" id="customModeBtn" onclick="switchToCustomMode()">自定义配置</button>
                    </div>
                </div>

                <div class="form-group" id="defaultConfigDisplay">
                    <label>默认配置说明</label>
                    <div class="config-description">
                        <p>每层默认配置：偶数个房间时四、六人间各一半，宿舍号从小到大排列，前几个为四人间</p>
                        <p>奇数个房间时四人间比六人间多一间，宿舍号从小到大排列，前几个为四人间</p>
                        <p>共计 <span id="defaultTotalRooms">60</span> 间宿舍</p>
                        <p>如需调整特定楼层的房间类型，请切换到自定义配置模式</p>
                    </div>
                    <div class="sort-mode-buttons">
                        <button type="button" class="sort-mode-btn active" id="ascSortBtn" onclick="setSortMode('asc')">正序（前四后六）</button>
                        <button type="button" class="sort-mode-btn" id="descSortBtn" onclick="setSortMode('desc')">倒序（前六后四）</button>
                    </div>
                </div>

                <div class="form-group" id="customConfigPanel" style="display: none;">
                    <label>自定义房间配置<span class="required">*</span></label>
                    <div class="custom-config-selector">
                        <label>选择楼层：</label>
                        <select id="customFloorSelector" onchange="showFloorEditor()">
                            <option value="">请选择楼层</option>
                        </select>
                    </div>
                    <div id="floorEditor" style="display: none;">
                        <div class="floor-config">
                            <div class="floor-header" id="editorFloorTitle">第1层</div>
                            <div class="room-type-config">
                                <div class="room-type-item">
                                    <label><span class="room-tag-icon double-room"></span>二人间</label>
                                    <div class="room-count-display" id="editorDoubleRooms">0</div>
                                </div>
                                <div class="room-type-item">
                                    <label><span class="room-tag-icon four-room"></span>四人间</label>
                                    <div class="room-count-display" id="editorFourRooms">5</div>
                                </div>
                                <div class="room-type-item">
                                    <label><span class="room-tag-icon six-room"></span>六人间</label>
                                    <div class="room-count-display" id="editorSixRooms">5</div>
                                </div>
                            </div>
                            <div class="room-preview">
                                <div class="preview-label">宿舍号预览：</div>
                                <div class="preview-numbers" id="editorPreview"></div>
                            </div>
                            <button type="button" class="btn-save-floor" onclick="saveFloorConfig()">保存楼层配置</button>
                        </div>
                    </div>
                    <div class="custom-config-summary" id="customConfigSummary">
                        <label>已修改楼层：</label>
                        <div id="modifiedFloorsList"></div>
                    </div>
                </div>

                <input type="hidden" name="configMode" id="configMode" value="default">
                <input type="hidden" name="sortMode" id="sortMode" value="asc">
                <input type="hidden" name="floorConfigsJson" id="floorConfigsJson">

                <div class="form-group">
                    <label>预计生成宿舍总数</label>
                    <div class="building-name-display" id="totalRoomsDisplay">60间</div>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn-submit">添加楼栋</button>
                    <button type="button" class="btn-cancel" onclick="window.location.href='/buildings'">取消</button>
                </div>
            </form>
        </div>
    </div>

    <th:block th:insert="~{fragments/ai-chat :: body}"></th:block>

    <script>
        let floorConfigs = {};
        let currentEditingFloor = null;
        let lastValidConfig = {};
        let sortMode = 'asc';

        document.addEventListener('DOMContentLoaded', function() {
            initFloorConfigs();
        });

        document.getElementById('floorCount').addEventListener('change', function() {
            initFloorConfigs();
            updateFloorSelector();
        });

        document.getElementById('roomsPerFloor').addEventListener('change', function() {
            initFloorConfigs();
        });

        function initFloorConfigs() {
            const floorCount = parseInt(document.getElementById('floorCount').value) || 0;
            const roomsPerFloor = parseInt(document.getElementById('roomsPerFloor').value) || 10;
            floorConfigs = {};
            const defaultRoomTypes = getDefaultRoomTypes(roomsPerFloor);
            for (let i = 1; i <= floorCount; i++) {
                floorConfigs[i] = [...defaultRoomTypes];
            }
            updateTotalRooms();
        }

        function switchToDefaultMode() {
            document.getElementById('defaultModeBtn').classList.add('active');
            document.getElementById('customModeBtn').classList.remove('active');
            document.getElementById('defaultConfigDisplay').style.display = 'block';
            document.getElementById('customConfigPanel').style.display = 'none';
            document.getElementById('configMode').value = 'default';
            initFloorConfigs();
        }

        function switchToCustomMode() {
            document.getElementById('defaultModeBtn').classList.remove('active');
            document.getElementById('customModeBtn').classList.add('active');
            document.getElementById('defaultConfigDisplay').style.display = 'none';
            document.getElementById('customConfigPanel').style.display = 'block';
            document.getElementById('configMode').value = 'custom';
            initFloorConfigs();
            updateFloorSelector();
            document.getElementById('floorEditor').style.display = 'none';
            document.getElementById('modifiedFloorsList').innerHTML = '';
        }

        function updateFloorSelector() {
            const floorCount = parseInt(document.getElementById('floorCount').value) || 0;
            const selector = document.getElementById('customFloorSelector');
            selector.innerHTML = '<option value="">请选择楼层</option>';
            for (let i = 1; i <= floorCount; i++) {
                selector.innerHTML += `<option value="${i}">第${i}层</option>`;
            }
        }

        function showFloorEditor() {
            const floor = parseInt(document.getElementById('customFloorSelector').value);
            if (!floor) {
                document.getElementById('floorEditor').style.display = 'none';
                return;
            }
            
            currentEditingFloor = floor;
            
            document.getElementById('editorFloorTitle').textContent = '第' + floor + '层';
            document.getElementById('floorEditor').style.display = 'block';
            updateEditorDisplay();
        }

        function updateEditorDisplay() {
            if (!currentEditingFloor) return;
            
            const roomsPerFloor = parseInt(document.getElementById('roomsPerFloor').value) || 10;
            const roomTypes = floorConfigs[currentEditingFloor] || getDefaultRoomTypes(roomsPerFloor);
            
            const counts = countRoomTypes(roomTypes);
            
            document.getElementById('editorDoubleRooms').textContent = counts.double;
            document.getElementById('editorFourRooms').textContent = counts.four;
            document.getElementById('editorSixRooms').textContent = counts.six;
            
            updateEditorPreview();
        }

        function countRoomTypes(roomTypes) {
            let doubleCount = 0, fourCount = 0, sixCount = 0;
            for (const type of roomTypes) {
                if (type === 'double') doubleCount++;
                else if (type === 'four') fourCount++;
                else if (type === 'six') sixCount++;
            }
            return { double: doubleCount, four: fourCount, six: sixCount };
        }

        function getDefaultRoomTypes(roomsPerFloor) {
            const roomTypes = [];
            const fourRooms = Math.ceil(roomsPerFloor / 2);
            const sixRooms = roomsPerFloor - fourRooms;
            
            if (sortMode === 'asc') {
                for (let i = 0; i < fourRooms; i++) {
                    roomTypes.push('four');
                }
                for (let i = 0; i < sixRooms; i++) {
                    roomTypes.push('six');
                }
            } else {
                for (let i = 0; i < sixRooms; i++) {
                    roomTypes.push('six');
                }
                for (let i = 0; i < fourRooms; i++) {
                    roomTypes.push('four');
                }
            }
            return roomTypes;
        }

        function setSortMode(mode) {
            sortMode = mode;
            document.getElementById('sortMode').value = mode;
            document.getElementById('ascSortBtn').classList.toggle('active', mode === 'asc');
            document.getElementById('descSortBtn').classList.toggle('active', mode === 'desc');
            initFloorConfigs();
        }

        function updateEditorPreview() {
            if (!currentEditingFloor) return;
            
            const roomsPerFloor = parseInt(document.getElementById('roomsPerFloor').value) || 10;
            const roomTypes = floorConfigs[currentEditingFloor] || getDefaultRoomTypes(roomsPerFloor);
            
            let previewHtml = '';
            for (let i = 0; i < roomTypes.length; i++) {
                const roomNum = i + 1;
                const type = roomTypes[i];
                let tagClass = '';
                let typeText = '';
                
                if (type === 'double') {
                    tagClass = 'double-room';
                    typeText = '2人';
                } else if (type === 'four') {
                    tagClass = 'four-room';
                    typeText = '4人';
                } else if (type === 'six') {
                    tagClass = 'six-room';
                    typeText = '6人';
                }
                
                previewHtml += `<span class="room-tag ${tagClass} editable" onclick="toggleRoomType(${roomNum})">${String(currentEditingFloor).padStart(2, '0')}${String(roomNum).padStart(2, '0')}(${typeText})</span>`;
            }
            
            document.getElementById('editorPreview').innerHTML = previewHtml || '<span style="color:#999;">无宿舍</span>';
        }

        function toggleRoomType(roomNum) {
            const roomsPerFloor = parseInt(document.getElementById('roomsPerFloor').value) || 10;
            let roomTypes = floorConfigs[currentEditingFloor] || getDefaultRoomTypes(roomsPerFloor);
            
            const index = roomNum - 1;
            if (index < 0 || index >= roomTypes.length) return;
            
            const currentType = roomTypes[index];
            let newType = 'four';
            
            if (currentType === 'four') {
                newType = 'six';
            } else if (currentType === 'six') {
                newType = 'double';
            } else if (currentType === 'double') {
                newType = 'four';
            }
            
            roomTypes[index] = newType;
            floorConfigs[currentEditingFloor] = roomTypes;
            updateEditorDisplay();
        }

        function saveFloorConfig() {
            if (!currentEditingFloor) return;
            
            const doubleRooms = parseInt(document.getElementById('editorDoubleRooms').value) || 0;
            const fourRooms = parseInt(document.getElementById('editorFourRooms').value) || 0;
            const sixRooms = parseInt(document.getElementById('editorSixRooms').value) || 0;
            
            floorConfigs[currentEditingFloor] = { double: doubleRooms, four: fourRooms, six: sixRooms };
            
            updateModifiedFloorsList();
            updateTotalRooms();
            
            alert('第' + currentEditingFloor + '层配置已保存');
        }

        function updateModifiedFloorsList() {
            const floorCount = parseInt(document.getElementById('floorCount').value) || 0;
            const roomsPerFloor = parseInt(document.getElementById('roomsPerFloor').value) || 10;
            const defaultRoomTypes = getDefaultRoomTypes(roomsPerFloor);
            
            let html = '';
            for (let i = 1; i <= floorCount; i++) {
                const roomTypes = floorConfigs[i] || [...defaultRoomTypes];
                const isModified = JSON.stringify(roomTypes) !== JSON.stringify(defaultRoomTypes);
                if (isModified) {
                    const counts = countRoomTypes(roomTypes);
                    html += `<div class="modified-floor-item">第${i}层：${counts.double}间二人间 + ${counts.four}间四人间 + ${counts.six}间六人间</div>`;
                }
            }
            document.getElementById('modifiedFloorsList').innerHTML = html || '<span style="color:#999;">暂无修改</span>';
        }

        function updateTotalRooms() {
            const floorCount = parseInt(document.getElementById('floorCount').value) || 0;
            const roomsPerFloor = parseInt(document.getElementById('roomsPerFloor').value) || 10;
            const totalRooms = floorCount * roomsPerFloor;
            document.getElementById('totalRoomsDisplay').textContent = totalRooms + '间';
            document.getElementById('defaultTotalRooms').textContent = totalRooms;
        }

        document.querySelector('form').addEventListener('submit', function() {
            document.getElementById('floorConfigsJson').value = JSON.stringify(floorConfigs);
        });

        
    </script>
</body>
</html>
