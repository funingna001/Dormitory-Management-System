<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宿舍报修 - 宿舍管理系统</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent-purple: #9B59B6;
            --card-bg: #FFFFFF;
            --text-primary: #2D3436;
            --text-secondary: #636E72;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            --radius: 20px;
            --radius-sm: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; 
            background: linear-gradient(135deg, #FFF5F5 0%, #E8F4FD 100%);
            min-height: 100vh;
            padding: 16px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .header-left h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .back-btn {
            padding: 8px 16px;
            background: var(--card-bg);
            border: none;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }
        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            display: block;
        }

        .repair-types {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .repair-type-btn {
            padding: 14px;
            border: 2px solid #E8EEF2;
            border-radius: var(--radius-sm);
            background: #FAFBFC;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .repair-type-btn:hover {
            border-color: var(--secondary);
            background: rgba(78, 205, 196, 0.08);
        }
        .repair-type-btn.selected {
            border-color: var(--secondary);
            background: rgba(78, 205, 196, 0.15);
            color: var(--secondary);
        }

        textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #E8EEF2;
            border-radius: var(--radius-sm);
            resize: vertical;
            min-height: 120px;
            font-family: inherit;
            font-size: 14px;
            color: var(--text-primary);
            transition: border-color 0.3s ease;
        }
        textarea:focus {
            outline: none;
            border-color: var(--secondary);
        }

        .image-upload {
            border: 2px dashed #E8EEF2;
            border-radius: var(--radius-sm);
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        .image-upload:hover {
            border-color: var(--secondary);
            background: rgba(78, 205, 196, 0.05);
        }
        .image-upload input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            top: 0;
            left: 0;
        }
        .upload-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        .upload-text {
            font-size: 14px;
            color: var(--text-secondary);
        }
        .image-preview {
            margin-top: 15px;
            display: none;
        }
        .image-preview.show {
            display: block;
        }
        .preview-image {
            max-width: 200px;
            max-height: 200px;
            border-radius: var(--radius-sm);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .remove-image-btn {
            margin-top: 10px;
            padding: 6px 16px;
            background: rgba(255, 107, 107, 0.15);
            color: #FF6B6B;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .remove-image-btn:hover {
            background: rgba(255, 107, 107, 0.25);
        }
        .form-group.disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--secondary) 0%, #3DB8B0 100%);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(78, 205, 196, 0.3);
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(78, 205, 196, 0.4);
        }

        .message {
            padding: 14px;
            border-radius: var(--radius-sm);
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }
        .message.success {
            background: rgba(46, 204, 113, 0.15);
            color: #2ECC71;
        }
        .message.error {
            background: rgba(255, 107, 107, 0.15);
            color: #FF6B6B;
        }

        .dorm-info {
            background: linear-gradient(135deg, rgba(78,205,196,0.1) 0%, rgba(61,184,176,0.1) 100%);
            padding: 16px;
            border-radius: var(--radius-sm);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .dorm-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--secondary) 0%, #3DB8B0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            color: white;
        }
        .dorm-text {
            font-size: 14px;
            color: var(--text-secondary);
        }
        .dorm-text strong {
            color: var(--text-primary);
            font-size: 16px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        @media (min-width: 768px) {
            body {
                max-width: 600px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <h1>🛠️ 宿舍报修</h1>
        </div>
        <button class="back-btn" onclick="location.href='/student/dashboard'">← 返回</button>
    </div>

    <div th:if="${success}" class="message success">
        ✓ 报修申请提交成功！
    </div>
    <div th:if="${error}" class="message error">
        ✗ [[${error}]]
    </div>

    <div class="card">
        <div class="dorm-info">
            <div class="dorm-icon">🏢</div>
            <div class="dorm-text">
                <div>报修宿舍</div>
                <strong th:text="${dormitoryNumber}"></strong>
            </div>
        </div>

        <form action="/repair/submit" method="post" enctype="multipart/form-data" onsubmit="return validateForm()">
            <div class="form-group">
                <label class="form-label">报修类型</label>
                <div class="repair-types">
                    <button type="button" class="repair-type-btn" th:each="type : ${repairTypes}" 
                        th:text="${type}" th:data-type="${type}"></button>
                </div>
                <input type="hidden" name="repairType" id="repairTypeInput" />
            </div>

            <div class="form-group disabled" id="descriptionGroup">
                <label class="form-label">问题描述</label>
                <textarea name="description" placeholder="请先选择报修类型..." th:text="${description}"></textarea>
            </div>

            <div class="form-group disabled" id="imageGroup">
                <label class="form-label">上传图片（可选）</label>
                <div class="image-upload">
                    <input type="file" name="image" accept="image/*" onchange="previewImage(this)" />
                    <div class="upload-icon">📷</div>
                    <div class="upload-text">请先选择报修类型<br><small>支持 JPG、PNG 格式</small></div>
                </div>
                <div class="image-preview" id="imagePreview">
                    <img class="preview-image" id="previewImg" src="" alt="预览" />
                    <br>
                    <button class="remove-image-btn" onclick="removeImage()">移除图片</button>
                </div>
            </div>

            <button type="submit" class="submit-btn">提交报修申请</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var buttons = document.querySelectorAll('.repair-type-btn');
            buttons.forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var type = this.getAttribute('data-type');
                    
                    document.querySelectorAll('.repair-type-btn').forEach(b => b.classList.remove('selected'));
                    this.classList.add('selected');
                    document.getElementById('repairTypeInput').value = type;
                    
                    document.getElementById('descriptionGroup').classList.remove('disabled');
                    document.getElementById('imageGroup').classList.remove('disabled');
                    
                    document.querySelector('textarea[name="description"]').placeholder = '请详细描述故障情况...';
                    document.querySelector('.image-upload .upload-text').innerHTML = '点击或拖拽上传图片<br><small>支持 JPG、PNG 格式</small>';
                    
                    var msgDiv = document.getElementById('validateMsg');
                    if (msgDiv) msgDiv.remove();
                });
            });
        });

        function validateForm() {
            var repairType = document.getElementById('repairTypeInput').value;
            
            if (!repairType || repairType.trim() === '') {
                var form = document.querySelector('form');
                var existingMsg = document.getElementById('validateMsg');
                if (existingMsg) existingMsg.remove();
                
                var msgDiv = document.createElement('div');
                msgDiv.id = 'validateMsg';
                msgDiv.className = 'message error';
                msgDiv.textContent = '✗ 请先选择报修类型';
                msgDiv.style.marginBottom = '16px';
                msgDiv.style.animation = 'shake 0.5s';
                
                form.insertBefore(msgDiv, form.firstChild);
                
                document.querySelectorAll('.repair-type-btn').forEach(btn => {
                    btn.style.borderColor = '#FF6B6B';
                    btn.style.boxShadow = '0 0 8px rgba(255, 107, 107, 0.3)';
                    setTimeout(() => {
                        btn.style.borderColor = '#E8EEF2';
                        btn.style.boxShadow = 'none';
                    }, 1000);
                });
                
                return false;
            }
            return true;
        }

        function previewImage(input) {
            if (input.files && input.files[0]) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('previewImg').src = e.target.result;
                    document.getElementById('imagePreview').classList.add('show');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function removeImage() {
            document.querySelector('input[name="image"]').value = '';
            document.getElementById('previewImg').src = '';
            document.getElementById('imagePreview').classList.remove('show');
        }
    </script>
</body>
</html>
