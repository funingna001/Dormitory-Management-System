<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>学生详情 - 宿舍管理系统</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent-yellow: #FFE66D;
            --accent-purple: #9B59B6;
            --accent-blue: #3498DB;
            --accent-green: #2ECC71;
            --accent-orange: #F39C12;
            --bg-gradient-start: #FFF5F5;
            --bg-gradient-end: #E8F4FD;
            --card-bg: #FFFFFF;
            --text-primary: #2D3436;
            --text-secondary: #636E72;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.12);
            --radius: 16px;
            --radius-sm: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; 
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
        }

        .header { 
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent-purple) 100%);
            color: white; 
            padding: 24px 32px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            box-shadow: 0 4px 20px rgba(255, 107, 107, 0.3);
        }
        .header h1 { 
            font-size: 28px; 
            font-weight: 700;
            letter-spacing: 1px;
        }
        .user-info { font-size: 16px; display: flex; align-items: center; gap: 20px; }
        .user-info a { color: rgba(255,255,255,0.9); text-decoration: none; padding: 8px 16px; border-radius: 20px; transition: all 0.3s ease; }
        .user-info a:hover { 
            background: rgba(255,255,255,0.2); 
            transform: translateY(-2px);
        }
        .role-badge {
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(10px);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .content { max-width: 700px; margin: 32px auto; padding: 0 24px; }

        .detail-container { 
            background: var(--card-bg); 
            padding: 40px; 
            border-radius: var(--radius); 
            box-shadow: var(--shadow);
            border: 1px solid rgba(255,255,255,0.6);
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }
        .detail-header h2 { 
            margin-bottom: 0;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .detail-row { 
            display: flex; 
            margin-bottom: 20px; 
            padding: 16px 0; 
            border-bottom: 1px solid #F0F4F8;
            transition: all 0.3s ease;
        }
        .detail-row:hover {
            background: #FFF8F8;
            padding-left: 8px;
            margin-left: -8px;
            margin-right: -8px;
            padding-right: 8px;
            border-radius: var(--radius-sm);
        }
        .detail-label { 
            width: 130px; 
            font-weight: 600; 
            color: var(--text-secondary); 
            flex-shrink: 0;
            font-size: 14px;
            letter-spacing: 0.5px;
        }
        .detail-value { 
            flex: 1; 
            color: var(--text-primary);
            font-size: 15px;
            font-weight: 500;
        }

        .detail-actions { 
            display: flex; 
            justify-content: flex-end; 
            gap: 12px; 
            margin-top: 32px; 
            padding-top: 24px; 
            border-top: 2px solid #F0F4F8;
        }

        .btn-back { 
            background: #F0F4F8; 
            color: var(--text-secondary); 
            padding: 12px 28px; 
            text-decoration: none; 
            border-radius: var(--radius-sm); 
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-back:hover { 
            background: #E0E6ED;
            transform: translateY(-2px);
        }

        .btn-edit { 
            background: linear-gradient(135deg, var(--accent-green) 0%, #27AE60 100%);
            color: white; 
            padding: 12px 28px; 
            text-decoration: none; 
            border-radius: var(--radius-sm); 
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
        }
        .btn-edit:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(46, 204, 113, 0.4);
        }

        .btn-delete { 
            background: linear-gradient(135deg, var(--primary) 0%, #E74C3C 100%);
            color: white; 
            padding: 12px 28px; 
            text-decoration: none; 
            border-radius: var(--radius-sm); 
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }
        .btn-delete:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
        }

        .empty-value { 
            color: #95A5A6; 
            font-style: italic;
            opacity: 0.6;
        }

        .info-card { 
            background: linear-gradient(135deg, #FFF8F8 0%, #F0F8FF 100%);
            padding: 20px; 
            border-radius: var(--radius-sm); 
            margin-bottom: 24px;
            border-left: 4px solid var(--primary);
        }
        .info-card .title { 
            font-size: 16px; 
            font-weight: 700; 
            color: var(--text-primary); 
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .info-card .desc { font-size: 14px; color: var(--text-secondary); }

        .detail-icon {
            font-size: 56px;
            text-align: center;
            margin-bottom: 24px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .value-tag {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        .value-tag-male {
            background: #E3F2FD;
            color: var(--accent-blue);
        }
        .value-tag-female {
            background: #FCE4EC;
            color: var(--primary);
        }

        .floating-ai-wrapper {
            position: fixed;
            left: 20px;
            bottom: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .floating-ai {
            width: 420px;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2), 0 0 0 1px rgba(0,0,0,0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 600px;
            margin-bottom: 15px;
            opacity: 0;
            visibility: hidden;
            transform: translateX(-100%) scale(0.9);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .floating-ai.open {
            opacity: 1;
            visibility: visible;
            transform: translateX(0) scale(1);
        }

        .floating-ai-toggle {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.5);
            border: 3px solid rgba(255, 255, 255, 0.9);
        }

        .floating-ai-toggle:hover {
            transform: scale(1.15);
            box-shadow: 0 12px 32px rgba(102, 126, 234, 0.6);
        }

        .floating-ai-toggle span {
            font-size: 26px;
            transition: transform 0.3s ease;
        }

        .floating-ai.open + .floating-ai-toggle span {
            transform: rotate(45deg);
        }

        .floating-ai-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .floating-ai-header .ai-icon {
            font-size: 24px;
            background: rgba(255,255,255,0.2);
            padding: 8px;
            border-radius: 8px;
        }

        .floating-ai-header .ai-title {
            color: white;
            font-size: 15px;
            font-weight: 700;
        }

        .floating-ai-commands {
            padding: 12px 15px;
            background: #F8F9FA;
            border-bottom: 1px solid #E9ECEF;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .floating-ai-commands .command-btn {
            padding: 5px 12px;
            background: white;
            border: 1px solid #DEE2E6;
            border-radius: 15px;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .floating-ai-commands .command-btn:hover {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: white;
        }

        .floating-ai-chat {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: var(--card-bg);
        }

        .floating-ai-chat .message {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .floating-ai-chat .message.ai .avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .floating-ai-chat .message.user .avatar {
            background: var(--accent-blue);
            color: white;
        }

        .floating-ai-chat .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .floating-ai-chat .message-content {
            flex: 1;
            max-width: 80%;
        }

        .floating-ai-chat .message.ai .message-content {
            background: #F8F9FA;
            border: 1px solid #E9ECEF;
            border-radius: 0 10px 10px 10px;
        }

        .floating-ai-chat .message.user .message-content {
            background: var(--accent-blue);
            color: white;
            border-radius: 10px 0 10px 10px;
            margin-left: auto;
        }

        .floating-ai-chat .message-text {
            padding: 8px 12px;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .floating-ai-chat .message.ai .message-text {
            color: var(--text-primary);
        }

        .floating-ai-chat .message.user .message-text {
            color: white;
        }

        .floating-ai-input-area {
            padding: 12px 15px;
            background: #F8F9FA;
            border-top: 1px solid #E9ECEF;
            display: flex;
            gap: 8px;
        }

        .floating-ai-input-area .ai-input {
            flex: 1;
            padding: 8px 14px;
            border: 1px solid #DEE2E6;
            border-radius: 20px;
            font-size: 13px;
            outline: none;
            transition: all 0.3s ease;
            background: white;
        }

        .floating-ai-input-area .ai-input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.1);
        }

        .floating-ai-input-area .ai-send-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .floating-ai-input-area .ai-send-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(102, 126, 234, 0.4);
        }

        .floating-ai-input-area .ai-send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .floating-ai-chat .typing-indicator {
            display: flex;
            gap: 3px;
            padding: 8px 12px;
        }

        .floating-ai-chat .typing-dot {
            width: 6px;
            height: 6px;
            background: #ADB5BD;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }

        .floating-ai-chat .typing-dot:nth-child(1) { animation-delay: 0s; }
        .floating-ai-chat .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .floating-ai-chat .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>宿舍管理系统</h1>
        <div class="user-info">
            欢迎, <span th:text="${user.realName != null && !user.realName.isEmpty() ? user.realName : user.username}"></span>
            <span class="role-badge" th:text="${user.role == 'admin' ? '管理员' : '学生'}"></span>
            <a href="/">首页</a>
            <a href="/dormitories">宿舍管理</a>
            <a href="/logout">退出登录</a>
        </div>
    </div>
    <div class="content">
        <div class="detail-container">
            <div class="detail-header">
                <h2>学生详情</h2>
                <a href="/dormitories" class="btn-back">返回宿舍管理</a>
            </div>
            <div class="detail-row">
                <span class="detail-label">学号</span>
                <span class="detail-value" th:text="${student.studentId}"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">姓名</span>
                <span class="detail-value" th:text="${student.name}"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">年级</span>
                <span class="detail-value" th:text="${student.grade}"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">班级</span>
                <span class="detail-value" th:text="${student.className != null && !student.className.isEmpty() ? student.className : '-'}" 
                      th:class="${student.className == null || student.className.isEmpty() ? 'empty-value' : ''}"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">性别</span>
                <span class="detail-value">
                    <span th:if="${student.gender == '男'}" class="value-tag value-tag-male">男</span>
                    <span th:if="${student.gender == '女'}" class="value-tag value-tag-female">女</span>
                    <span th:if="${student.gender == null || student.gender.isEmpty()}" class="empty-value">-</span>
                </span>
            </div>
            <div class="detail-row">
                <span class="detail-label">电话号码</span>
                <span class="detail-value" th:text="${student.phone}"></span>
            </div>

            <div class="detail-row">
                <span class="detail-label">宿舍号</span>
                <span class="detail-value" th:text="${student.dormitoryNumber != null && !student.dormitoryNumber.isEmpty() ? #strings.substringAfter(student.dormitoryNumber, '-') : '-'}" 
                      th:class="${student.dormitoryNumber == null || student.dormitoryNumber.isEmpty() ? 'empty-value' : ''}"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">学生ID</span>
                <span class="detail-value">#[[${student.id}]]</span>
            </div>
            <div class="info-card">
                <div class="title">说明</div>
                <div class="desc">
                    <ul style="margin-left:20px;color:#666;">
                        <li>学号为学生唯一标识，不可重复</li>
                        <li>电话号码用于紧急联系，请确保准确</li>
                        <li>邮箱用于接收学校通知和重要信息</li>
                        <li>班级和性别信息便于学生分类管理</li>
                        <li>宿舍号可以随时修改调整</li>
                    </ul>
                </div>
            </div>
            <div class="detail-actions">
                <a th:href="@{/dormitories}" class="btn-back">返回宿舍管理</a>
                <a th:href="@{/students/edit/{id}(id=${student.id})}" class="btn-edit">编辑</a>
                <a th:href="@{/students/delete/{id}(id=${student.id})}" class="btn-delete" onclick="return confirm('确定要删除该学生吗？此操作不可撤销。')">删除</a>
            </div>
        </div>
    </div>

    <th:block th:insert="~{fragments/ai-chat :: body}"></th:block>

    <script>
    </script>
</body>
</html>
