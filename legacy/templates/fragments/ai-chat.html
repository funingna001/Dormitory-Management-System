<div th:fragment="body">
    <div class="floating-ai-wrapper">
        <div id="floatingAi" class="floating-ai">
            <div class="floating-ai-header">
                <div class="ai-icon">🤖</div>
                <div class="ai-title">AI智能助手</div>
                <button class="ai-close" onclick="toggleFloatingAi()">✕</button>
            </div>
            <div class="floating-ai-commands">
                <button class="command-btn" onclick="sendCommand('查看学生统计')">📊 学生统计</button>
                <button class="command-btn" onclick="sendCommand('查看宿舍统计')">🏠 宿舍统计</button>
                <button class="command-btn" onclick="sendCommand('查看男女比例')">👫 男女比例</button>
                <button class="command-btn" onclick="sendCommand('查看年级分布')">📚 年级分布</button>
                <button class="command-btn" onclick="sendCommand('查看空闲宿舍')">🔓 空闲宿舍</button>
                <button class="command-btn" onclick="sendCommand('查看入住率')">📈 入住率</button>
            </div>
            <div class="floating-ai-export">
                <div class="export-label">📥 数据导出</div>
                <button class="export-btn" onclick="exportData('students')">📝 学生信息</button>
                <button class="export-btn" onclick="exportData('dormitories')">🏢 宿舍信息</button>
                <button class="export-btn" onclick="exportData('buildings')">🏠 楼栋信息</button>
                <button class="export-btn primary" onclick="exportData('all')">📦 全部数据</button>
            </div>
            <div class="floating-ai-chat" id="aiChat">
                <div class="message ai">
                    <div class="avatar">🤖</div>
                    <div class="message-content">
                        <div class="message-text">您好！我是宿舍管理系统的AI助手。点击快捷命令或输入问题获取统计分析。</div>
                    </div>
                </div>
            </div>
            <div class="floating-ai-input-area">
                <input type="text" class="ai-input" id="aiInput" placeholder="输入问题..." onkeypress="handleEnter(event)">
                <button class="ai-send-btn" id="aiSendBtn" onclick="sendMessage()">发送</button>
            </div>
        </div>
        <div class="floating-ai-toggle" onclick="toggleFloatingAi()">
            <span>🤖</span>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'ai_conversation_history';
        
        function toggleFloatingAi() {
            const ai = document.getElementById('floatingAi');
            if (ai) {
                ai.classList.toggle('open');
            }
        }

        function handleEnter(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('aiInput');
            const sendBtn = document.getElementById('aiSendBtn');
            const chat = document.getElementById('aiChat');
            const message = input.value.trim();

            if (!message) return;

            input.disabled = true;
            sendBtn.disabled = true;

            appendMessage('user', message);
            saveMessage('user', message);
            input.value = '';

            appendTypingIndicator();

            try {
                const response = await fetch('/api/ai/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                
                removeTypingIndicator();
                
                if (data.success) {
                    appendMessage('ai', data.reply);
                    saveMessage('ai', data.reply);
                } else {
                    appendMessage('ai', '抱歉，我暂时无法回答这个问题。');
                    saveMessage('ai', '抱歉，我暂时无法回答这个问题。');
                }
            } catch (error) {
                removeTypingIndicator();
                appendMessage('ai', '网络连接异常，请稍后再试。');
                saveMessage('ai', '网络连接异常，请稍后再试。');
            } finally {
                input.disabled = false;
                sendBtn.disabled = false;
                input.focus();
                chat.scrollTop = chat.scrollHeight;
            }
        }

        function sendCommand(command) {
            const input = document.getElementById('aiInput');
            if (input) {
                input.value = command;
                sendMessage();
            }
        }

        function appendMessage(sender, text) {
            const chat = document.getElementById('aiChat');
            if (!chat) return;
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const avatar = sender === 'ai' ? '🤖' : '👤';
            const avatarBg = sender === 'ai' ? 'var(--ai-bg)' : 'var(--accent-blue)';
            
            messageDiv.innerHTML = `
                <div class="avatar" style="background: ${avatarBg}">${avatar}</div>
                <div class="message-content">
                    <div class="message-text">${escapeHtml(text)}</div>
                </div>
            `;
            
            chat.appendChild(messageDiv);
            chat.scrollTop = chat.scrollHeight;
        }

        function appendTypingIndicator() {
            const chat = document.getElementById('aiChat');
            if (!chat) return;
            
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message ai typing';
            typingDiv.innerHTML = `
                <div class="avatar" style="background: var(--ai-bg)">🤖</div>
                <div class="message-content">
                    <div class="typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            `;
            chat.appendChild(typingDiv);
            chat.scrollTop = chat.scrollHeight;
        }

        function removeTypingIndicator() {
            const chat = document.getElementById('aiChat');
            if (!chat) return;
            
            const typing = chat.querySelector('.typing');
            if (typing) {
                typing.remove();
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function saveMessage(sender, text) {
            try {
                const history = getConversationHistory();
                history.push({
                    sender: sender,
                    text: text,
                    timestamp: new Date().toISOString()
                });
                localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
            } catch (e) {
                console.error('Failed to save message:', e);
            }
        }

        function getConversationHistory() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                return data ? JSON.parse(data) : [];
            } catch (e) {
                return [];
            }
        }

        function loadConversationHistory() {
            const chat = document.getElementById('aiChat');
            if (!chat) return;
            
            const history = getConversationHistory();
            
            chat.innerHTML = '';
            
            if (history.length === 0) {
                chat.innerHTML = `
                    <div class="message ai">
                        <div class="avatar">🤖</div>
                        <div class="message-content">
                            <div class="message-text">您好！我是宿舍管理系统的AI助手。点击快捷命令或输入问题获取统计分析。</div>
                        </div>
                    </div>
                `;
                return;
            }
            
            history.forEach(function(msg) {
                appendMessage(msg.sender, msg.text);
            });
        }

        async function exportData(type) {
            var urls = {
                'students': '/api/export/students',
                'dormitories': '/api/export/dormitories',
                'buildings': '/api/export/buildings',
                'all': '/api/export/all'
            };
            
            if (!urls[type]) {
                return;
            }
            
            try {
                const response = await fetch(urls[type], {
                    method: 'GET',
                    credentials: 'include'
                });
                
                if (!response.ok) {
                    throw new Error('下载失败，状态码: ' + response.status);
                }
                
                const blob = await response.blob();
                const contentDisposition = response.headers.get('Content-Disposition');
                let filename = 'download.xlsx';
                
                if (contentDisposition) {
                    const match = contentDisposition.match(/filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/);
                    if (match && match[1]) {
                        filename = decodeURIComponent(match[1].replace(/['"]/g, ''));
                    }
                }
                
                const url = window.URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                window.URL.revokeObjectURL(url);
            } catch (error) {
                console.error('导出失败:', error);
                alert('导出失败，请重试');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadConversationHistory();
        });
    </script>
</div>
